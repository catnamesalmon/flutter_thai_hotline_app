name: flutter_thai_hotline_app
description: "Thai hotline directory for Assignment 07."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: 8.2.1
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - icon/
    - images/aboutme/
    - images/travel/
    - images/emergency/
    - images/bank/
    - images/pubutil/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: icon/icon.png
  remove_alpha_ios: true